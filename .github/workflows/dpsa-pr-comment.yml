# Copy to .github/workflows/.
# Org: COPILOT_GITHUB_TOKEN: ${{ github.token }}. User-owned: secrets.COPILOT_GITHUB_TOKEN (README).
name: DPSA PR comment

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    # Keep only this app's staging/UAT base names. Comment out or delete the rest.
    branches:
      - main
permissions:
  contents: write
  pull-requests: write
  issues: write
  copilot-requests: write

concurrency:
  group: dpsa-pr-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dpsa-comment:
    name: Comment DPSA report
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'dpsa-exception')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DPSA_BLOCK_ON: critical
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base ref for diff
        if: github.event.action != 'ready_for_review'
        env:
          DPSA_BASE_REF: ${{ github.base_ref }}
        run: |
          case "$DPSA_BASE_REF" in
            ""|*[!A-Za-z0-9._/-]*) echo "Invalid DPSA_BASE_REF"; exit 1 ;;
          esac
          git fetch --no-tags origin "$DPSA_BASE_REF"

      - name: Require DPSA skill
        if: github.event.action != 'ready_for_review'
        run: |
          test -f .github/skills/dpsa/SKILL.md || {
            echo "Missing .github/skills/dpsa/SKILL.md — copy this toolkit into the app .github/ folder."
            exit 1
          }

      - name: Set up Node.js
        if: github.event.action != 'ready_for_review'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        if: github.event.action != 'ready_for_review'
        run: npm install -g @github/copilot

      - name: Run DPSA via Copilot CLI
        if: github.event.action != 'ready_for_review'
        id: dpsa
        continue-on-error: true
        env:
          # Organization repo (default): built-in token — no PAT or Actions secret.
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          # User-owned repo: comment the line above and uncomment this.
          # COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DPSA_BASE_REF: ${{ github.base_ref }}
          DPSA_BLOCK_ON: ${{ env.DPSA_BLOCK_ON }}
        run: |
          set -euo pipefail
          case "$DPSA_BASE_REF" in
            ""|*[!A-Za-z0-9._/-]*) echo "Invalid DPSA_BASE_REF"; exit 1 ;;
          esac
          case "$DPSA_BLOCK_ON" in
            critical|high) ;;
            *) echo "Invalid DPSA_BLOCK_ON"; exit 1 ;;
          esac
          PROMPT_FILE=".github/dpsa-ci/dpsa-ci-prompt.md"
          test -f "$PROMPT_FILE" || { echo "Missing $PROMPT_FILE"; exit 1; }
          PROMPT="$(sed -e "s/\${DPSA_BASE_REF}/${DPSA_BASE_REF}/g" -e "s/\${DPSA_BLOCK_ON}/${DPSA_BLOCK_ON}/g" "$PROMPT_FILE")"
          mkdir -p /tmp/dpsa
          set +e
          copilot -p "$PROMPT" \
            -s \
            --allow-tool='shell(git:*)' \
            --no-ask-user \
            > /tmp/dpsa/report.md 2> /tmp/dpsa/copilot.err
          STATUS=$?
          set -e
          if [[ $STATUS -ne 0 ]] || ! grep -q "^## Digital Product Security Assessment" /tmp/dpsa/report.md; then
            echo "Copilot CLI did not return a DPSA report (exit ${STATUS})."
            cat /tmp/dpsa/copilot.err || true
            : > /tmp/dpsa/report.md
          fi

      - name: Post or update PR comment
        if: github.event.action != 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          DPSA_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/dpsa-ci/post-dpsa-comment.sh /tmp/dpsa/report.md

      - name: Load existing DPSA comment
        if: github.event.action == 'ready_for_review'
        env:
          GH_TOKEN: ${{ github.token }}
          DPSA_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/dpsa-ci/load-dpsa-comment.sh /tmp/dpsa/report.md

      - name: Block on DPSA_BLOCK_ON (unless dpsa-exception)
        env:
          GH_TOKEN: ${{ github.token }}
          DPSA_PR_NUMBER: ${{ github.event.pull_request.number }}
          DPSA_BLOCK_ON: ${{ env.DPSA_BLOCK_ON }}
          DPSA_RELOCK: ${{ github.event.action == 'ready_for_review' }}
        run: bash .github/dpsa-ci/enforce-dpsa-critical.sh /tmp/dpsa/report.md
