# Copy to .github/workflows/. Secret: COPILOT_GITHUB_TOKEN.
# Fails only when Critical > 0 and the PR has no dpsa-exception label.
name: DPSA PR comment

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    # Keep only this app's staging/UAT base names. Comment out or delete the rest.
    branches:
      - staging
      - stage
      - uat
      - preprod
      - pre-prod
      - "*-staging"
      - "*-stage"
      - "*-uat"
      - "*-preprod"
      # - main
      # - develop
      # - iacc-preprod

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: dpsa-pr-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dpsa-comment:
    name: Comment DPSA report
    if: >
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'dpsa-exception')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Fetch base ref for diff
        env:
          DPSA_BASE_REF: ${{ github.base_ref }}
        run: |
          case "$DPSA_BASE_REF" in
            ""|*[!A-Za-z0-9._/-]*) echo "Invalid DPSA_BASE_REF"; exit 1 ;;
          esac
          git fetch --no-tags origin "$DPSA_BASE_REF"

      - name: Require DPSA skill
        run: |
          test -f .github/skills/dpsa/SKILL.md || {
            echo "Missing .github/skills/dpsa/SKILL.md — copy this toolkit into the app .github/ folder."
            exit 1
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Run DPSA via Copilot CLI
        id: dpsa
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          DPSA_BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          case "$DPSA_BASE_REF" in
            ""|*[!A-Za-z0-9._/-]*) echo "Invalid DPSA_BASE_REF"; exit 1 ;;
          esac
          PROMPT_FILE=".github/dpsa-ci/dpsa-ci-prompt.md"
          test -f "$PROMPT_FILE" || { echo "Missing $PROMPT_FILE"; exit 1; }
          PROMPT="$(sed "s/\${DPSA_BASE_REF}/${DPSA_BASE_REF}/g" "$PROMPT_FILE")"
          mkdir -p /tmp/dpsa
          set +e
          copilot -p "$PROMPT" \
            -s \
            --allow-tool='shell(git:*)' \
            --no-ask-user \
            > /tmp/dpsa/report.md 2> /tmp/dpsa/copilot.err
          STATUS=$?
          set -e
          if [[ $STATUS -ne 0 ]] || ! grep -q "^## Digital Product Security Assessment" /tmp/dpsa/report.md; then
            echo "Copilot CLI did not return a DPSA report (exit ${STATUS})."
            cat /tmp/dpsa/copilot.err || true
            : > /tmp/dpsa/report.md
          fi

      - name: Post or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          DPSA_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/dpsa-ci/post-dpsa-comment.sh /tmp/dpsa/report.md

      - name: Block on Critical (unless dpsa-exception)
        env:
          GH_TOKEN: ${{ github.token }}
          DPSA_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash .github/dpsa-ci/enforce-dpsa-critical.sh /tmp/dpsa/report.md
